<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Scanner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <div id="scanner-container">
            <video id="scanner-video"></video>
            <div class="scanner-overlay">
                <div class="laser-beam"></div>
                <div class="scanner-target"></div>
                <div class="scanning-feedback">Point camera at barcode</div>
            </div>
        </div>
        <div id="controls">
            <div id="scanner-buttons">
                <button id="startButton">Start</button>
                <button id="torchButton">🔦 Flashlight</button>
                <button id="stopButton">Stop</button>
                <button id="switchCameraButton">📷 Switch Camera</button>
            </div>
            <div id="search-bar">
                <input type="text" id="searchInput" placeholder="Search by Title, Author, or ISBN...">
                <button id="searchButton">Search</button>
            </div>
        </div>
        <div id="results-container">
            </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.18.6/umd/index.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
