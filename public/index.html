<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Book Junior</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://unpkg.com/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary:       #1E3A5F;
            --primary-dark:  #162D4A;
            --primary-light: #EEF4FB;
            --accent:        #2563EB;
            --accent-light:  #EFF6FF;
            --success:       #16A34A;
            --success-light: #F0FDF4;
            --danger:        #DC2626;
            --danger-light:  #FEF2F2;
            --bg:            #F0F3F7;
            --surface:       #FFFFFF;
            --border:        #E2E8F0;
            --border-light:  #F1F5F9;
            --text-1:        #0F172A;
            --text-2:        #475569;
            --text-3:        #94A3B8;
            --header-h:      56px;
            --nav-h:         64px;
            --r-sm:          8px;
            --r-md:          12px;
            --r-lg:          16px;
            --shadow-sm:     0 1px 2px rgba(0,0,0,0.05), 0 1px 4px rgba(0,0,0,0.04);
            --shadow-md:     0 2px 8px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.05);
            --shadow-lg:     0 8px 28px rgba(0,0,0,0.13), 0 2px 8px rgba(0,0,0,0.06);
        }

        *, *::before, *::after {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html { height: 100%; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text-1);
            -webkit-font-smoothing: antialiased;
            min-height: 100%;
            padding-top: var(--header-h);
            padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
        }

        /* ============================
           LOGIN OVERLAY
        ============================ */
        #login-overlay {
            position: fixed; inset: 0;
            background: var(--bg);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        .login-box {
            background: var(--surface);
            border-radius: var(--r-lg);
            padding: 44px 32px 36px;
            text-align: center;
            max-width: 360px;
            width: 100%;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
        }
        .login-logo {
            width: 60px; height: 60px;
            background: var(--primary);
            border-radius: 15px;
            margin: 0 auto 24px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 14px rgba(30,58,95,0.35);
        }
        .login-logo svg { width: 30px; height: 30px; fill: white; }
        .login-box h2 {
            font-size: 22px; font-weight: 800;
            letter-spacing: -0.5px; margin-bottom: 8px;
            color: var(--text-1);
        }
        .login-box p {
            color: var(--text-3); font-size: 14px;
            margin-bottom: 32px; line-height: 1.55;
        }
        .btn-google {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; padding: 13px 20px;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: var(--r-sm);
            font-size: 14px; font-weight: 600;
            cursor: pointer; color: var(--text-1);
            font-family: inherit;
            transition: all 0.15s ease;
            letter-spacing: -0.1px;
        }
        .btn-google:hover { background: var(--border-light); border-color: #CBD5E1; }
        .btn-google:active { transform: scale(0.98); }
        #login-error {
            background: var(--danger-light);
            color: var(--danger);
            border: 1px solid #FECACA;
            border-radius: var(--r-sm);
            padding: 12px 14px;
            font-size: 13px;
            margin-top: 16px;
            text-align: left;
            line-height: 1.45;
        }
        .btn-guest {
            display: flex; align-items: center; justify-content: center;
            width: 100%; padding: 13px 20px;
            background: transparent;
            border: 1.5px solid var(--border);
            border-radius: var(--r-sm);
            font-size: 14px; font-weight: 600;
            cursor: pointer; color: var(--text-2);
            font-family: inherit;
            transition: all 0.15s ease;
            letter-spacing: -0.1px;
            margin-top: 10px;
        }
        .btn-guest:hover { background: var(--border-light); color: var(--text-1); }
        .btn-guest:active { transform: scale(0.98); }
        .guest-limit-card {
            background: #FFFBEB;
            border: 1.5px solid #FCD34D;
            border-radius: var(--r-md);
            padding: 24px 20px;
            margin-bottom: 16px;
            text-align: center;
            box-shadow: var(--shadow-md);
        }
        .guest-limit-title {
            font-size: 16px; font-weight: 700;
            color: #92400E; margin-bottom: 8px;
        }
        .guest-limit-body {
            font-size: 14px; color: #78350F;
            line-height: 1.55; margin-bottom: 16px;
        }

        /* ============================
           TOP HEADER
        ============================ */
        .app-header {
            position: fixed; top: 0; left: 0; right: 0;
            height: var(--header-h);
            background: var(--primary);
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 10px;
        }
        .header-logo {
            width: 34px; height: 34px;
            background: rgba(255,255,255,0.12);
            border-radius: 9px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .header-logo svg { width: 19px; height: 19px; fill: white; }
        .header-title {
            font-size: 17px; font-weight: 700;
            color: white; letter-spacing: -0.3px;
            flex: 1;
        }
        .header-user {
            display: flex; align-items: center; gap: 8px;
        }
        #user-info {
            font-size: 11px; color: rgba(255,255,255,0.55);
            max-width: 96px; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
        }
        .btn-signout {
            font-size: 12px; padding: 6px 13px;
            background: rgba(255,255,255,0.12);
            color: rgba(255,255,255,0.85);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.22);
            cursor: pointer; font-weight: 600;
            font-family: inherit;
            transition: background 0.15s;
            letter-spacing: -0.1px;
        }
        .btn-signout:hover { background: rgba(255,255,255,0.22); }

        /* ============================
           BOTTOM NAV
        ============================ */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
            padding-bottom: env(safe-area-inset-bottom, 0px);
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            z-index: 100;
            box-shadow: 0 -1px 0 var(--border), 0 -4px 16px rgba(0,0,0,0.05);
        }
        .nav-tab {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 5px;
            border: none; background: none;
            cursor: pointer; font-family: inherit;
            color: var(--text-3);
            transition: color 0.15s;
            padding: 0; text-decoration: none;
        }
        .nav-tab:active { opacity: 0.65; }
        .nav-tab.active { color: var(--primary); }
        .nav-icon {
            width: 24px; height: 24px;
        }
        .nav-label {
            font-size: 10px; font-weight: 700;
            letter-spacing: 0.3px; text-transform: uppercase;
        }
        /* active indicator dot */
        .nav-tab.active .nav-label::after {
            content: '';
            display: block;
            width: 4px; height: 4px;
            background: var(--primary);
            border-radius: 50%;
            margin: 3px auto 0;
        }

        /* ============================
           SCROLL CONTENT AREA
        ============================ */
        .scroll-content {
            max-width: 560px;
            margin: 0 auto;
            padding: 20px 16px 28px;
        }

        /* ============================
           SCAN ACTION TILES
        ============================ */
        .scan-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .scan-tile {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            padding: 16px 18px;
            border-radius: var(--r-md);
            border: none;
            cursor: pointer;
            font-family: inherit;
            text-align: left;
            transition: all 0.15s ease;
            box-shadow: var(--shadow-sm);
        }
        .scan-tile:active { transform: scale(0.98); box-shadow: none; }

        .scan-tile-primary {
            background: var(--primary);
            border: 1.5px solid transparent;
        }
        .scan-tile-primary:hover { background: var(--primary-dark); }

        .scan-tile-secondary {
            background: var(--surface);
            border: 1.5px solid var(--border);
        }
        .scan-tile-secondary:hover { background: var(--border-light); border-color: #CBD5E1; }

        .tile-icon {
            width: 42px; height: 42px;
            border-radius: var(--r-sm);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .scan-tile-primary .tile-icon { background: rgba(255,255,255,0.15); }
        .scan-tile-secondary .tile-icon { background: var(--primary-light); }

        .tile-icon svg {
            width: 21px; height: 21px;
        }
        .scan-tile-primary .tile-icon svg { stroke: white; fill: none; }
        .scan-tile-secondary .tile-icon svg { stroke: var(--primary); fill: none; }

        .tile-text { flex: 1; }
        .tile-label {
            font-size: 15px; font-weight: 700;
            letter-spacing: -0.2px;
            margin-bottom: 2px;
        }
        .scan-tile-primary .tile-label { color: white; }
        .scan-tile-secondary .tile-label { color: var(--text-1); }

        .tile-desc { font-size: 12px; }
        .scan-tile-primary .tile-desc { color: rgba(255,255,255,0.65); }
        .scan-tile-secondary .tile-desc { color: var(--text-3); }

        .tile-chevron { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.4; }
        .scan-tile-primary .tile-chevron { stroke: white; fill: none; }
        .scan-tile-secondary .tile-chevron { stroke: var(--text-2); fill: none; }

        /* ============================
           CAMERA SCANNER CONTAINER
        ============================ */
        #scanner-container {
            display: none;
            background: var(--surface);
            border-radius: var(--r-md);
            overflow: hidden;
            margin-bottom: 16px;
            border: 1.5px solid var(--border);
            box-shadow: var(--shadow-md);
        }
        .scanner-header {
            padding: 13px 16px;
            border-bottom: 1px solid var(--border-light);
            display: flex; align-items: center; gap: 8px;
        }
        .scanner-header-title {
            font-size: 14px; font-weight: 600; color: var(--text-1); flex: 1;
        }
        #reader { width: 100%; position: relative; background: #000; min-height: 200px; }
        #reader video { width: 100%; height: auto; display: block; }
        #reader canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #reader canvas.drawingBuffer { position: absolute; top: 0; left: 0; }
        .scanner-footer { padding: 12px 14px; }

        /* ============================
           SEARCH CONTAINER
        ============================ */
        #search-container {
            display: none;
            background: var(--surface);
            border-radius: var(--r-md);
            padding: 16px;
            margin-bottom: 16px;
            border: 1.5px solid var(--border);
            box-shadow: var(--shadow-md);
        }
        .search-label {
            font-size: 11px; font-weight: 700;
            color: var(--text-3); margin-bottom: 10px;
            text-transform: uppercase; letter-spacing: 0.7px;
        }
        .search-input {
            width: 100%; padding: 12px 14px;
            font-size: 15px;
            border: 1.5px solid var(--border);
            border-radius: var(--r-sm);
            font-family: inherit;
            color: var(--text-1); outline: none;
            background: var(--bg);
            transition: border-color 0.15s, box-shadow 0.15s;
            margin-bottom: 10px;
        }
        .search-input:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(30,58,95,0.1);
        }
        .search-input::placeholder { color: var(--text-3); }
        .search-actions { display: flex; gap: 8px; }

        /* ============================
           BUTTONS
        ============================ */
        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            gap: 6px; padding: 12px 20px;
            font-size: 14px; font-weight: 600;
            border: none; border-radius: var(--r-sm);
            cursor: pointer; font-family: inherit;
            transition: all 0.15s ease;
            letter-spacing: -0.1px; flex: 1;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--surface); color: var(--text-1); border: 1.5px solid var(--border); }
        .btn-secondary:hover { background: var(--border-light); }
        .btn-danger { background: var(--surface); color: var(--danger); border: 1.5px solid #FECACA; }
        .btn-danger:hover { background: var(--danger-light); }
        .btn-sm { padding: 8px 14px; font-size: 13px; border-radius: 7px; flex: none; }
        .btn-full { width: 100%; }

        /* ============================
           RESULT CARD
        ============================ */
        .result-card {
            background: var(--surface);
            border-radius: var(--r-md);
            overflow: hidden;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-md);
        }

        /* Book header */
        .result-book-header {
            padding: 20px 20px 16px;
        }
        .book-genre-tag {
            display: inline-block;
            padding: 3px 10px;
            background: var(--accent-light);
            color: var(--accent);
            border-radius: 20px;
            font-size: 11px; font-weight: 700;
            letter-spacing: 0.3px; text-transform: uppercase;
            margin-bottom: 10px;
        }
        .book-title {
            font-size: 21px; font-weight: 800;
            color: var(--text-1);
            letter-spacing: -0.5px; line-height: 1.2;
            margin-bottom: 5px;
        }
        .book-author {
            font-size: 14px; color: var(--text-2); font-weight: 500;
        }

        /* Location block — the primary info */
        .location-block {
            padding: 14px 20px;
            border-top: 1px solid var(--border-light);
            border-bottom: 1px solid var(--border-light);
        }
        .location-loading {
            display: flex; align-items: center; gap: 10px;
            color: var(--text-3); font-size: 13px; font-weight: 500;
        }
        .spinner {
            width: 16px; height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
            flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .location-card {
            border-radius: var(--r-sm);
            background: var(--primary-light);
            border: 1.5px solid #C2D9F0;
            padding: 14px 16px;
        }
        .location-card-row1 {
            display: flex; align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .location-eyebrow {
            font-size: 10px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.9px;
            color: var(--primary);
        }
        .ai-chip {
            font-size: 10px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.5px; padding: 2px 8px;
            background: var(--accent); color: white;
            border-radius: 20px;
        }
        .location-shelf {
            font-size: 24px; font-weight: 800;
            color: var(--primary); letter-spacing: -0.5px;
            line-height: 1.1; margin-bottom: 2px;
        }
        .location-subject-name {
            font-size: 14px; font-weight: 600;
            color: var(--text-1); margin-bottom: 0;
        }
        .location-reasoning {
            font-size: 12px; color: var(--text-2);
            font-style: italic; line-height: 1.45;
            padding-top: 8px; margin-top: 8px;
            border-top: 1px solid #C2D9F0;
        }
        .location-none {
            font-size: 13px; color: var(--text-3);
            font-style: italic;
        }

        /* Description block */
        .description-block {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-light);
        }
        .section-label {
            font-size: 10px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.9px;
            color: var(--text-3); margin-bottom: 7px;
        }
        .description {
            color: var(--text-2); line-height: 1.65;
            font-size: 13px;
            max-height: 72px; overflow: hidden;
            transition: max-height 0.3s ease;
        }
        .description.expanded { max-height: none; }
        .expand-btn {
            color: var(--accent); font-size: 12px; font-weight: 600;
            cursor: pointer; background: none; border: none;
            padding: 5px 0 0; font-family: inherit;
        }

        /* Action buttons */
        .result-actions {
            padding: 14px 20px;
            display: flex; flex-direction: column; gap: 9px;
        }
        .amazon-link {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            padding: 11px 20px;
            background: var(--surface); color: var(--text-2);
            border: 1.5px solid var(--border);
            border-radius: var(--r-sm);
            font-size: 13px; font-weight: 600;
            text-decoration: none; transition: all 0.15s;
        }
        .amazon-link:hover { background: var(--border-light); }

        /* ============================
           WEB RESULTS CONTAINER
        ============================ */
        .web-card {
            background: var(--surface);
            border-radius: var(--r-md);
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-md);
            margin-bottom: 16px;
        }
        #web-ai-section {
            border-bottom: 1px solid var(--border-light);
        }
        .web-results-header {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-light);
        }
        .web-results-title {
            font-size: 15px; font-weight: 700; color: var(--text-1);
            letter-spacing: -0.2px;
        }
        .web-results-sub {
            font-size: 12px; color: var(--text-3); margin-top: 2px;
        }
        .web-result-item {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-light);
        }
        .web-result-item:last-child { border-bottom: none; }
        .web-result-name { font-weight: 600; font-size: 14px; color: var(--text-1); margin-bottom: 3px; }
        .web-result-domain { font-size: 11px; color: var(--success); font-weight: 600; margin-bottom: 5px; }
        .web-result-snippet { font-size: 13px; color: var(--text-2); line-height: 1.45; }
        .web-result-btn {
            margin-top: 10px; width: 100%;
            padding: 10px 16px;
            background: var(--primary); color: white;
            border: none; border-radius: var(--r-sm);
            font-size: 13px; font-weight: 600;
            cursor: pointer; font-family: inherit;
            transition: background 0.15s;
        }
        .web-result-btn:hover { background: var(--primary-dark); }
        .web-result-btn:active { transform: scale(0.98); }

        /* ============================
           SAVED BOOKS VIEW
        ============================ */
        #saved-view { min-height: 100%; }
        .saved-scroll {
            max-width: 560px; margin: 0 auto;
            padding: 20px 16px 28px;
        }
        .saved-toolbar {
            display: flex; align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .saved-title {
            font-size: 22px; font-weight: 800;
            letter-spacing: -0.5px; color: var(--text-1);
        }
        .saved-book-card {
            background: var(--surface);
            border-radius: var(--r-md);
            padding: 16px 18px; margin-bottom: 10px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }
        .saved-book-title  { font-size: 15px; font-weight: 700; margin-bottom: 2px; color: var(--text-1); letter-spacing: -0.2px; }
        .saved-book-author { font-size: 13px; color: var(--text-2); font-weight: 500; margin-bottom: 10px; }
        .saved-location-pill {
            display: inline-flex; align-items: center; gap: 5px;
            background: var(--primary-light); color: var(--primary);
            border-radius: 6px; padding: 4px 10px;
            font-size: 12px; font-weight: 700;
            margin-bottom: 8px;
        }
        .saved-book-meta {
            font-size: 12px; color: var(--text-3);
            margin-bottom: 8px;
            display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
        }
        .saved-book-notes {
            font-size: 13px; color: var(--text-2);
            background: var(--bg); padding: 8px 12px;
            border-radius: var(--r-sm); margin-bottom: 10px;
            border: 1px solid var(--border-light); line-height: 1.45;
        }
        .saved-book-actions { display: flex; gap: 8px; }

        /* Source badges */
        .source-badge {
            display: inline-block; padding: 2px 8px; border-radius: 20px;
            font-size: 10px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .source-isbn   { background: var(--accent-light); color: #1E40AF; }
        .source-cover  { background: #EDE9FE; color: #6D28D9; }
        .source-search { background: var(--success-light); color: #065F46; }
        .source-web    { background: #E0F2FE; color: #0369A1; }
        .source-manual { background: var(--border-light); color: var(--text-2); }

        /* Edit fields */
        .edit-field {
            width: 100%; padding: 9px 12px; font-size: 14px;
            border: 1.5px solid var(--border); border-radius: var(--r-sm);
            margin-bottom: 10px; font-family: inherit;
            color: var(--text-1); outline: none; background: var(--bg);
        }
        .edit-field:focus { border-color: var(--primary); background: white; }

        /* ============================
           MODALS (bottom sheets)
        ============================ */
        .modal {
            display: none; position: fixed; inset: 0;
            background: rgba(15,23,42,0.45);
            z-index: 1000;
            justify-content: flex-end;
            align-items: flex-end;
            backdrop-filter: blur(3px);
        }
        .modal.active { display: flex; }
        .modal-sheet {
            background: var(--surface);
            border-radius: var(--r-lg) var(--r-lg) 0 0;
            width: 100%; max-height: 92vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 -4px 32px rgba(0,0,0,0.18);
            animation: slideUp 0.22s cubic-bezier(0.25,0.46,0.45,0.94);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }
        .modal-drag-handle {
            width: 36px; height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin: 12px auto 0;
        }
        .modal-header-row {
            display: flex; align-items: center;
            padding: 18px 20px 14px;
            border-bottom: 1px solid var(--border-light);
        }
        .modal-title {
            font-size: 17px; font-weight: 700;
            letter-spacing: -0.3px; color: var(--text-1); flex: 1;
        }
        .close-modal {
            width: 28px; height: 28px; border-radius: 50%;
            background: var(--border-light); border: none;
            font-size: 17px; cursor: pointer; color: var(--text-2);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; transition: all 0.15s;
        }
        .close-modal:hover { background: var(--border); color: var(--text-1); }
        .modal-body { padding: 16px 20px; }

        /* Modal list items (book picker) */
        .modal-item {
            padding: 13px 16px;
            border: 1.5px solid var(--border);
            border-radius: var(--r-sm); margin-bottom: 10px;
            cursor: pointer; transition: all 0.15s;
        }
        .modal-item:hover { border-color: var(--primary); background: var(--primary-light); }
        .modal-item:active { transform: scale(0.98); }
        .modal-item-title  { font-weight: 600; margin-bottom: 3px; font-size: 14px; color: var(--text-1); }
        .modal-item-author { color: var(--text-2); font-size: 13px; }

        /* ============================
           FORMS
        ============================ */
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block; font-weight: 700; font-size: 11px;
            margin-bottom: 6px; color: var(--text-3);
            text-transform: uppercase; letter-spacing: 0.6px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%; padding: 11px 14px; font-size: 14px;
            border: 1.5px solid var(--border); border-radius: var(--r-sm);
            outline: none; font-family: inherit;
            color: var(--text-1); background: var(--bg);
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(30,58,95,0.08);
        }
        .form-group textarea { resize: vertical; min-height: 72px; line-height: 1.5; }
        .modal-form-actions { display: flex; gap: 8px; margin-top: 4px; padding-bottom: 4px; }

        /* ============================
           STATUS TOAST
        ============================ */
        #status {
            position: fixed;
            bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 12px);
            left: 16px; right: 16px;
            padding: 13px 18px;
            background: #1E293B;
            color: white;
            border-radius: var(--r-md);
            box-shadow: var(--shadow-lg);
            font-size: 13px; font-weight: 500;
            text-align: center; z-index: 200;
            animation: fadeInUp 0.18s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ============================
           ERROR / EMPTY / LOADING
        ============================ */
        .error-card {
            background: var(--danger-light); color: var(--danger);
            border: 1.5px solid #FECACA;
            padding: 14px 18px; border-radius: var(--r-md);
            font-size: 14px; line-height: 1.5; margin-bottom: 16px;
        }
        .empty-state {
            text-align: center; padding: 64px 24px; color: var(--text-3);
        }
        .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.45; }
        .empty-state p { font-size: 14px; line-height: 1.5; }
        .loading-state {
            text-align: center; padding: 48px;
            color: var(--text-3); font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Login Overlay -->
    <div id="login-overlay">
        <div class="login-box">
            <div class="login-logo">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15zm0 0A2.5 2.5 0 0 0 6.5 22H20v-3H6.5A2.5 2.5 0 0 1 4 19.5z"/>
                </svg>
            </div>
            <h2>Book Junior.</h2>
            <p>Sign in with your existing Google account to continue. No sign up necessary.</p>
            <button class="btn-google" onclick="signInWithGoogle()">
                <svg width="17" height="17" viewBox="0 0 18 18">
                    <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
                    <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
                    <path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/>
                    <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 6.294C4.672 4.169 6.656 3.58 9 3.58z"/>
                </svg>
                Continue with Google
            </button>
            <button class="btn-guest" onclick="loginAsGuest()">Login as Guest</button>
            <div id="login-error" style="display:none;"></div>
        </div>
    </div>

    <!-- Top Header -->
    <header class="app-header">
        <div class="header-logo">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15zm0 0A2.5 2.5 0 0 0 6.5 22H20v-3H6.5A2.5 2.5 0 0 1 4 19.5z"/>
            </svg>
        </div>
        <span class="header-title">Book Junior</span>
        <div class="header-user">
            <span id="user-info"></span>
            <button class="btn-signout" onclick="doSignOut()">Sign out</button>
        </div>
    </header>

    <!-- Scanner View -->
    <div id="scanner-view">
        <div class="scroll-content">

            <div class="scan-actions">
                <!-- Primary: Scan Barcode -->
                <button class="scan-tile scan-tile-primary" onclick="startScanner()">
                    <div class="tile-icon">
                        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                            <line x1="3"  y1="5"  x2="3"  y2="19"/>
                            <line x1="6"  y1="5"  x2="6"  y2="19"/>
                            <line x1="9"  y1="5"  x2="9"  y2="19"/>
                            <line x1="12" y1="5"  x2="12" y2="19"/>
                            <line x1="15.5" y1="5" x2="15.5" y2="19"/>
                            <line x1="18" y1="5"  x2="18" y2="19"/>
                            <line x1="21" y1="5"  x2="21" y2="19"/>
                        </svg>
                    </div>
                    <div class="tile-text">
                        <div class="tile-label">Scan Barcode</div>
                        <div class="tile-desc">Point camera at the ISBN barcode</div>
                    </div>
                    <svg class="tile-chevron" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                </button>

                <!-- Secondary: Scan Cover -->
                <button class="scan-tile scan-tile-secondary" onclick="triggerCoverCapture()">
                    <div class="tile-icon">
                        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                            <circle cx="12" cy="13" r="4"/>
                        </svg>
                    </div>
                    <div class="tile-text">
                        <div class="tile-label">Scan Cover</div>
                        <div class="tile-desc">AI identifies the book from a photo</div>
                    </div>
                    <svg class="tile-chevron" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                </button>

                <!-- Secondary: Manual Search -->
                <button class="scan-tile scan-tile-secondary" onclick="showSearch()">
                    <div class="tile-icon">
                        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                    </div>
                    <div class="tile-text">
                        <div class="tile-label">Manual Search</div>
                        <div class="tile-desc">Search by title, author, or ISBN</div>
                    </div>
                    <svg class="tile-chevron" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                </button>
            </div>

            <input type="file" id="cover-input" accept="image/*" capture="environment" style="display:none;" onchange="handleCoverCapture(event)">

            <!-- Camera scanner -->
            <div id="scanner-container">
                <div class="scanner-header">
                    <span class="scanner-header-title">Scanning for barcode…</span>
                </div>
                <div id="reader"></div>
                <div class="scanner-footer">
                    <button class="btn btn-secondary btn-full" onclick="stopScanner()">Cancel</button>
                </div>
            </div>

            <!-- Manual search -->
            <div id="search-container">
                <div class="search-label">Search books</div>
                <input type="text" class="search-input" id="search-input" placeholder="Title, author, or ISBN…">
                <div class="search-actions">
                    <button class="btn btn-secondary" onclick="hideSearch()">Cancel</button>
                    <button class="btn btn-primary" onclick="performSearch()">Search</button>
                </div>
            </div>

            <div id="results"></div>
        </div>
    </div>

    <!-- Saved Books View -->
    <div id="saved-view" style="display:none;">
        <div class="saved-scroll">
            <div class="saved-toolbar">
                <div class="saved-title">Saved Books</div>
                <button id="btn-add-book" class="btn btn-primary btn-sm" onclick="openManualAdd()">+ Add</button>
            </div>
            <div id="saved-books-list">
                <div class="empty-state">
                    <div class="empty-icon">📚</div>
                    <p>No saved books yet.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Book Selection Modal (bottom sheet) -->
    <div class="modal" id="results-modal">
        <div class="modal-sheet">
            <div class="modal-drag-handle"></div>
            <div class="modal-header-row">
                <div class="modal-title">Which book is this?</div>
                <button class="close-modal" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <div id="modal-results"></div>
            </div>
        </div>
    </div>

    <!-- Save / Confirm Details Modal (bottom sheet) -->
    <div class="modal" id="save-modal">
        <div class="modal-sheet">
            <div class="modal-drag-handle"></div>
            <div class="modal-header-row">
                <div class="modal-title" id="save-modal-title">Save Book to Library</div>
                <button class="close-modal" onclick="closeSaveModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="save-title" placeholder="Book title">
                </div>
                <div class="form-group">
                    <label>Author</label>
                    <input type="text" id="save-author" placeholder="Author name">
                </div>
                <div class="form-group">
                    <label>ISBN</label>
                    <input type="text" id="save-isbn" placeholder="ISBN (optional)">
                </div>
                <div class="form-group">
                    <label>Subject / Shelf Location</label>
                    <select id="save-subject">
                        <option value="">— Select subject —</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="save-notes" placeholder="Optional notes…"></textarea>
                </div>
                <input type="hidden" id="save-source" value="manual">
                <input type="hidden" id="save-description" value="">
                <div class="modal-form-actions">
                    <button class="btn btn-secondary" style="flex:1;" onclick="closeSaveModal()">Cancel</button>
                    <button class="btn btn-primary" style="flex:2;" onclick="confirmSave()">Save to Library</button>
                </div>
            </div>
        </div>
    </div>

    <div id="status" style="display:none;"></div>

    <script>
        // ===================================
        // Firebase Config & Init (compat SDK)
        // ===================================
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyARQ4yDOCkhfBPuSD_euLMRrgXR4WFvXus",
            authDomain: "book-scanner-jkk.firebaseapp.com",
            projectId: "book-scanner-jkk",
            storageBucket: "book-scanner-jkk.firebasestorage.app",
            messagingSenderId: "750998293229",
            appId: "1:750998293229:web:f84c9fc64927d180929ae4",
            measurementId: "G-JKT9PR30B0"
        };
        firebase.initializeApp(FIREBASE_CONFIG);
        const auth = firebase.auth();
        const db   = firebase.firestore();
        let currentUser = null;
        let isGuest     = false;

        // ===================================
        // Cloud Function URLs
        // ===================================
        const CLOUD_FUNCTION_URL      = 'https://getbooktopic-pom3tqjr6a-uc.a.run.app';
        const COVER_FUNCTION_URL      = 'https://identifybookcover-pom3tqjr6a-uc.a.run.app';
       const WEB_SEARCH_FUNCTION_URL = 'https://us-central1-book-scanner-jkk.cloudfunctions.net/webSearch';// update after deploy
        const USE_AI_CLASSIFICATION   = true;

        // ===================================
        // Auth
        // ===================================
        auth.onAuthStateChanged(async user => {
            if (user) {
                // Anonymous users must explicitly click "Login as Guest" each visit —
                // keep the login overlay visible; loginAsGuest() handles the transition.
                if (user.isAnonymous) return;

                console.log('AUTH: user signed in:', user.email);
                // Check allowlist before granting access
                try {
                    console.log('AUTH: checking allowlist for', user.email);
                    const doc = await db.collection('allowedUsers').doc(user.email).get();
                    console.log('AUTH: doc exists?', doc.exists);
                    if (!doc.exists) {
                        await auth.signOut();
                        const el = document.getElementById('login-error');
                        el.textContent = 'Your account is not authorized. Contact an administrator to request access.';
                        el.style.display = 'block';
                        return;
                    }
                } catch (err) {
                    console.error('AUTH: allowlist check error:', err.code, err.message);
                    await auth.signOut();
                    const el = document.getElementById('login-error');
                    el.textContent = 'Unable to verify account access. Please try again.';
                    el.style.display = 'block';
                    return;
                }
                isGuest = false;
                currentUser = user;
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('user-info').textContent = user.email;
                document.getElementById('btn-add-book').style.display = '';
            } else {
                isGuest = false;
                currentUser = null;
                document.getElementById('login-overlay').style.display = 'flex';
            }
        });

        function signInWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.setCustomParameters({ prompt: 'select_account' });
            auth.signInWithPopup(provider).catch(err => {
                console.error('POPUP ERROR:', err.code, err.message);
                const el = document.getElementById('login-error');
                el.textContent = err.message;
                el.style.display = 'block';
            });
        }

        function loginAsGuest() {
            document.getElementById('login-error').style.display = 'none';
            // On return visits Firebase restores the anonymous session to auth.currentUser
            // before the user clicks anything.  Use it directly instead of calling
            // signInAnonymously(), which has an unreliable fast-path in the compat SDK
            // when a session is already active.
            if (auth.currentUser && auth.currentUser.isAnonymous) {
                isGuest = true;
                currentUser = auth.currentUser;
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('user-info').textContent = 'Guest';
                document.getElementById('btn-add-book').style.display = 'none';
                return;
            }
            // First visit (or after explicit sign-out): create a new anonymous session.
            auth.signInAnonymously().then(result => {
                isGuest = true;
                currentUser = result.user;
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('user-info').textContent = 'Guest';
                document.getElementById('btn-add-book').style.display = 'none';
                document.getElementById('login-error').style.display = 'none';
            }).catch(err => {
                console.error('GUEST LOGIN ERROR:', err.code, err.message);
                const el = document.getElementById('login-error');
                el.textContent = 'Unable to sign in as guest. Please try again.';
                el.style.display = 'block';
            });
        }

        function doSignOut() {
            isGuest = false;
            currentUser = null;
            auth.signOut();
        }

        // ===================================
        // View Switching
        // ===================================
        function showView(view) {
            document.getElementById('scanner-view').style.display = view === 'scanner' ? '' : 'none';
            document.getElementById('saved-view').style.display   = view === 'saved'   ? '' : 'none';
            document.getElementById('tab-scanner').classList.toggle('active', view === 'scanner');
            document.getElementById('tab-saved').classList.toggle('active',   view === 'saved');
            if (view === 'saved') loadSavedBooks();
        }

        // ===================================
        // Scanner state
        // ===================================
        let scanner       = null;
        let quaggaHandler = null;
        let directory     = [];
        let currentBook   = null;
        let pendingSave   = null;   // data for the save modal
        let currentScanSource = 'manual';
        let lastScannedCode   = null;
        let scanInProgress    = false;
        let scanCounts        = {};
        const REQUIRED_CONFIRMATIONS = 3;

        // ===================================
        // Fetch with timeout helper
        // ===================================
        function fetchWithTimeout(url, options = {}, timeoutMs = 10000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            return fetch(url, {...options, signal: controller.signal})
                .finally(() => clearTimeout(timer));
        }

        // ===================================
        // Directory
        // ===================================
        async function loadDirectory() {
            showStatus('Loading directory...');
            try {
                const response = await fetch('Directory VSN. 1.A - Master (All Floors).csv');
                const csvText  = await response.text();
                Papa.parse(csvText, {
                    header: true,
                    complete: function(results) {
                        directory = results.data.map(row => ({
                            subject:  (row.SUBJECT || '').trim(),
                            floor:    row.FLOOR || '',
                            aisle:    row.AISLE || '',
                            room:     row['ROOM/DESCRIPTION'] || '',
                            keywords: (row.KEYWORDS || '').split(',').map(k => k.trim().toLowerCase()).filter(k => k)
                        })).filter(entry => entry.subject);
                        console.log(`Loaded ${directory.length} directory entries`);
                        hideStatus();
                        populateSubjectDropdown();
                    }
                });
            } catch (error) {
                showError('Failed to load directory. Please refresh the page.');
                console.error('Directory load error:', error);
            }
        }

        function populateSubjectDropdown() {
            const sel = document.getElementById('save-subject');
            // Clear all options except the first placeholder
            while (sel.options.length > 1) sel.remove(1);
            const subjects = [...new Set(directory.map(e => e.subject))].sort();
            subjects.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                sel.appendChild(opt);
            });
        }

        // ===================================
        // Barcode Scanner
        // ===================================
        function startScanner() {
            document.getElementById('scanner-container').style.display = 'block';
            document.getElementById('search-container').style.display  = 'none';
            document.getElementById('results').innerHTML = '';
            scanInProgress = false;
            lastScannedCode = null;
            scanCounts = {};

            Quagga.init({
                inputStream: {
                    name: "Live", type: "LiveStream",
                    target: document.querySelector('#reader'),
                    constraints: {
                        facingMode: "environment",
                        width:  { min: 640, ideal: 1280 },
                        height: { min: 480, ideal: 720 },
                        advanced: [{ focusMode: "continuous" }]
                    },
                },
                decoder: { readers: ["ean_reader", "ean_8_reader", "upc_reader", "upc_e_reader"] },
                locate: true,
                locator: { patchSize: "medium", halfSample: true }
            }, function(err) {
                if (err) {
                    console.error('Quagga init error:', err);
                    showError('Unable to start camera. Please check permissions.');
                    stopScanner();
                    return;
                }
                scanner = true;
                if (quaggaHandler) { Quagga.offDetected(quaggaHandler); quaggaHandler = null; }

                quaggaHandler = function(result) {
                    if (!result || !result.codeResult || !result.codeResult.code) return;
                    if (scanInProgress) return;

                    const code   = result.codeResult.code;
                    const format = result.codeResult.format;
                    const decodedCodes = result.codeResult.decodedCodes || [];
                    const errors = decodedCodes.filter(x => x.error !== undefined).map(x => x.error);
                    if (errors.length > 0) {
                        const avgError = errors.reduce((a, b) => a + b, 0) / errors.length;
                        if (avgError > 0.15) return;
                    }

                    const cleanCode = code.replace(/[^0-9]/g, '');
                    if (cleanCode.length !== 10 && cleanCode.length !== 13) return;

                    if (lastScannedCode && lastScannedCode !== code) scanCounts = {};
                    scanCounts[code] = (scanCounts[code] || 0) + 1;
                    lastScannedCode  = code;
                    if (scanCounts[code] < REQUIRED_CONFIRMATIONS) {
                        showStatus(`Reading barcode... (${scanCounts[code]}/${REQUIRED_CONFIRMATIONS})`);
                        return;
                    }

                    console.log('Detected barcode:', code, 'Format:', format);
                    scanInProgress = true;
                    showStatus(`Detected ${format}: ${code}`);
                    stopScanner();
                    searchByISBN(code);
                };

                Quagga.onDetected(quaggaHandler);
                Quagga.start();
            });
        }

        function triggerCoverCapture() {
            document.getElementById('scanner-container').style.display = 'none';
            document.getElementById('search-container').style.display  = 'none';
            document.getElementById('results').innerHTML = '';

        async function handleCoverCapture(event) {
            const file = event.target.files[0];
            if (!file) return;
            const ALLOWED_TYPES = ['image/jpeg', 'image/png', 'image/webp'];
            if (!ALLOWED_TYPES.includes(file.type)) {
                showError('Unsupported image format. Please use JPEG, PNG, or WebP.');
                return;
            }
            if (file.size > 5 * 1024 * 1024) {
                showError('Image is too large (max 5 MB). Please use a smaller photo.');
                return;
            }
            showStatus('Reading cover...');
            const reader = new FileReader();
            reader.onload = async function(e) {
                const dataUrl    = e.target.result;
                const [meta, imageBase64] = dataUrl.split(',');
                const mimeType   = meta.match(/:(.*?);/)[1];
                try {
                    showStatus('Identifying book from cover...');
                    const idToken = await currentUser.getIdToken();
                    const response = await fetchWithTimeout(COVER_FUNCTION_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${idToken}`
                        },
                        body: JSON.stringify({imageBase64, mimeType})
                    }, 30000);
                    const data = await response.json();
                    if (!response.ok) {
                        if (response.status === 429) {
                            showGuestLimitInResults(data.error || 'Guest scan limit reached. Sign in with Google for unlimited access.');
                            return;
                        }
                        showError('Could not identify book from cover. Try a clearer photo or use Manual Search.');
                        return;
                    }
                    if (!data.title) {
                        showError('Could not identify book from cover. Try a clearer photo or use Manual Search.');
                        return;
                    }
                    console.log('Cover identified:', data.title, 'by', data.author);
                    showStatus('Looking up book...');

                    const query = data.author
                        ? `intitle:${encodeURIComponent(data.title)}+inauthor:${encodeURIComponent(data.author)}`
                        : `intitle:${encodeURIComponent(data.title)}`;

                    const booksResponse = await fetchWithTimeout(`https://www.googleapis.com/books/v1/volumes?q=${query}&maxResults=5`);
                    const booksData     = await booksResponse.json();
                    hideStatus();

                    if (!booksData.items || booksData.items.length === 0) {
                        const fallback     = await fetchWithTimeout(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(data.title)}&maxResults=5`);
                        const fallbackData = await fallback.json();
                        if (!fallbackData.items || fallbackData.items.length === 0) {
                            try {
                                const olResults = await openLibraryTextSearch(null, data.title, data.author);
                                if (olResults.length > 0) {
                                    currentScanSource = 'cover_scan';
                                    olResults.length === 1
                                        ? displayBook(olResults[0])
                                        : showResultsModal(olResults);
                                    return;
                                }
                            } catch (olErr) {
                                // ignore, fall through to web search
                            }
                            currentScanSource = 'cover_scan';
                            await performWebSearch(`${data.title} ${data.author || ''} book`);
                            return;
                        }
                        currentScanSource = 'cover_scan';
                        fallbackData.items.length === 1
                            ? displayBook(fallbackData.items[0])
                            : showResultsModal(fallbackData.items);
                        return;
                    }

                    currentScanSource = 'cover_scan';
                    booksData.items.length === 1
                        ? displayBook(booksData.items[0])
                        : showResultsModal(booksData.items);

                } catch (error) {
                    hideStatus();
                    showError('Cover scan failed. Please check your connection or try Manual Search.');
                    console.error('Cover scan error:', error);
                }
            };
            reader.readAsDataURL(file);
        }

        function stopScanner() {

        async function performSearch() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;
            showStatus('Searching...');
            try {
                const response = await fetchWithTimeout(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(query)}&maxResults=5`);
                const data     = await response.json();
                hideStatus();

                if (!data.items || data.items.length === 0) {
                    try {
                        const olResults = await openLibraryTextSearch(query);
                        if (olResults.length > 0) {
                            currentScanSource = 'book_search';

                        // ignore, fall through to web search
                    }
                    currentScanSource = 'web_search';
                    await performWebSearch(`${query} book`);
                    return;
                }

                currentScanSource = 'book_search';
                if (data.items.length === 1) { displayBook(data.items[0]); hideSearch(); }
                else showResultsModal(data.items);
            } catch (error) {
                hideStatus();
                showError('Search failed. Please check your connection.');
                console.error('Search error:', error);

        // ===================================
        // Open Library Fallback
        // ===================================
        function adaptOpenLibraryDoc(doc) {
            const isbn = (doc.isbn || [])[0] || '';
            const fs = doc.first_sentence;
            const firstSentence = fs ? (typeof fs === 'string' ? fs : (fs.value || '')) : '';
            const subjects = (doc.subject || []).slice(0, 20);
            // Build description: first sentence + subject tags so AI has enough to classify
            const description = [firstSentence, subjects.length ? 'Subjects: ' + subjects.join(', ') : '']
                .filter(Boolean).join(' ') || '';
            return {
                volumeInfo: {
                    title:       doc.title || 'Unknown Title',
                    authors:     doc.author_name || ['Unknown Author'],
                    description: description,
                    categories:  subjects,
                    industryIdentifiers: isbn ? [{ type: 'ISBN_13', identifier: isbn }] : [],
                }
            };
        }

        async function openLibraryISBNLookup(isbn) {
            const url = `https://openlibrary.org/search.json?isbn=${isbn}&fields=key,title,author_name,isbn,subject,first_sentence&limit=1`;
            try {
                const response = await fetchWithTimeout(url, {}, 20000);
                const data = await response.json();
                if (!data.docs || !data.docs.length) { return null; }
                return adaptOpenLibraryDoc(data.docs[0]);
            } catch (err) {
                return null;
            }
        }

        async function openLibraryTextSearch(query, title, author) {
            let url;
            if (title) {
                url = `https://openlibrary.org/search.json?title=${encodeURIComponent(title)}${author ? '&author=' + encodeURIComponent(author) : ''}&limit=5&fields=key,title,author_name,isbn,subject,first_sentence`;
            } else {
                url = `https://openlibrary.org/search.json?q=${encodeURIComponent(query)}&limit=5&fields=key,title,author_name,isbn,subject,first_sentence`;
            }
            try {
                const response = await fetchWithTimeout(url, {}, 20000);
                const data = await response.json();
                if (!data.docs || !data.docs.length) { return []; }
                return data.docs.map(adaptOpenLibraryDoc);
            } catch (err) {
                return [];
            }
        }

        async function searchByISBN(isbn) {
            showStatus('Looking up book...');
            try {
                const cleanISBN = isbn.replace(/[^0-9X]/gi, '');
                let data, response;

                // Strategy 1: direct ISBN search
                response = await fetchWithTimeout(`https://www.googleapis.com/books/v1/volumes?q=isbn:${cleanISBN}`);
                data = await response.json();

                // Strategy 2: try ISBN-10 if EAN-13
                if ((!data.items || !data.items.length) && cleanISBN.length === 13 && (cleanISBN.startsWith('978') || cleanISBN.startsWith('979'))) {
                    const isbn9 = cleanISBN.substring(3, 12);
                    let sum = 0;
                    for (let i = 0; i < 9; i++) { sum += parseInt(isbn9[i]) * (10 - i); }
                    const checkDigit = (11 - (sum % 11)) % 11;
                    const isbn10 = isbn9 + (checkDigit === 10 ? 'X' : checkDigit.toString());
                    response = await fetchWithTimeout(`https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn10}`);
                    data = await response.json();
                }

                // Strategy 3: general query
                if (!data.items || !data.items.length) {
                    response = await fetchWithTimeout(`https://www.googleapis.com/books/v1/volumes?q=${cleanISBN}`);
                    data = await response.json();
                }

                hideStatus();

                if (!data.items || !data.items.length) {
                    // Try Open Library before giving up (handles Google Books quota errors)
                    try {
                        let olBook = await openLibraryISBNLookup(cleanISBN);
                        if (!olBook && cleanISBN.length === 13) {
                            // Also try the ISBN-10 on Open Library
                            const isbn9 = cleanISBN.substring(3, 12);
                            let sum = 0;
                            for (let i = 0; i < 9; i++) { sum += parseInt(isbn9[i]) * (10 - i); }
                            const checkDigit = (11 - (sum % 11)) % 11;
                            const isbn10 = isbn9 + (checkDigit === 10 ? 'X' : checkDigit.toString());
                            olBook = await openLibraryISBNLookup(isbn10);
                        }
                        if (olBook) {
                            currentScanSource = 'isbn_scan';
                            displayBook(olBook);
                            scanInProgress = false;
                            return;
                        }
                    } catch (olErr) {
                        // ignore, fall through to web search
                    }
                    scanInProgress = false;
                    currentScanSource = 'isbn_scan';
                    await performWebSearch(`ISBN ${cleanISBN} book`);
                    return;
                }

                currentScanSource = 'isbn_scan';
                if (data.items.length === 1) {
                    displayBook(data.items[0]);
                } else {
                    showResultsModal(data.items);
                }
                scanInProgress = false;
            } catch (error) {
                hideStatus();
                showError('Lookup failed. Please check your connection.');
                console.error('ISBN lookup error:', error);
                scanInProgress = false;
            }
        }

        // ===================================
        // Web Search Fallback
        // ===================================
        async function performWebSearch(query) {
            showStatus('Searching the web...');
            try {
                const idToken = await currentUser.getIdToken();
                const resp = await fetchWithTimeout(WEB_SEARCH_FUNCTION_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${idToken}`
                    },
                    body: JSON.stringify({query}),
                }, 15000);
                const data = await resp.json();
                hideStatus();
                if (!data.results || data.results.length === 0) {
                    showError('Nothing found. Use "Add Manually" in Saved Books to save the book directly.');
                    return;
                }
                renderWebResults(data.results, query);
            } catch (error) {
                hideStatus();
                showError('Web search failed. Use "Add Manually" in Saved Books to save the book directly.');
                console.error('Web search error:', error);
            }
        }

                        ${data.subject ? `<strong>${escapeHtml(data.subject)}</strong>` : ''}
                        ${data.isbn && data.isbn !== 'N/A' ? `<span>ISBN ${escapeHtml(data.isbn)}</span>` : ''}
                    </div>
                    ${data.notes ? `<div class="saved-book-notes">📝 ${escapeHtml(data.notes)}</div>` : ''}
                    <div class="saved-book-meta" style="font-size:11px;">Saved by ${escapeHtml(data.savedBy || '')}</div>
                    ${!isGuest ? `
                    <div class="saved-book-actions">
                        <button class="btn btn-secondary btn-sm" onclick="editSavedBook('${id}')">✏️ Edit</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteSavedBook('${id}')">🗑️ Delete</button>
                    </div>` : ''}
                </div>
            `;
        }

        function editSavedBook(id) {
            const card = document.getElementById(`saved-${id}`);
            if (!card) return;
            const currentTitle   = card.querySelector('.saved-book-title')?.textContent || '';
            const currentAuthor  = card.querySelector('.saved-book-author')?.textContent || '';
            const notesEl        = card.querySelector('.saved-book-notes');
            const currentNotes   = notesEl ? notesEl.textContent.replace(/^📝\s*/, '') : '';
            const currentSubject = card.querySelector('.saved-book-meta strong')?.textContent || '';

            const subjects = [...new Set(directory.map(e => e.subject))].sort();
            const subjectOptions = subjects.map(s =>
                `<option value="${escapeHtml(s)}"${s === currentSubject ? ' selected' : ''}>${escapeHtml(s)}</option>`
            ).join('');

            card.innerHTML = `
                <div class="form-group">
                    <label>Title</label>
                    <input class="edit-field" id="edit-title-${id}" value="${escapeHtml(currentTitle)}">
                </div>
                <div class="form-group">
                    <label>Author</label>
                    <input class="edit-field" id="edit-author-${id}" value="${escapeHtml(currentAuthor)}">
                </div>
                <div class="form-group">
                    <label>Subject / Shelf Location</label>
                    <select class="edit-field" id="edit-subject-${id}">
                        <option value="">— No subject —</option>
                        ${subjectOptions}
                    </select>
                </div>
                <div class="form-group">
                    <label>Notes</label>
                    <textarea class="edit-field" id="edit-notes-${id}">${escapeHtml(currentNotes)}</textarea>
                </div>
                <div style="display:flex; gap:8px;">
                    <button class="btn btn-secondary btn-sm" onclick="loadSavedBooks()">Cancel</button>
                    <button class="btn btn-primary btn-sm" onclick="submitEditSavedBook('${id}')">Save</button>
                </div>
            `;
        }

        async function submitEditSavedBook(id) {
            const title   = document.getElementById(`edit-title-${id}`).value.trim();
            const author  = document.getElementById(`edit-author-${id}`).value.trim();
            const subject = document.getElementById(`edit-subject-${id}`).value;
            const notes   = document.getElementById(`edit-notes-${id}`).value.trim();
            if (!title) { alert('Title is required.'); return; }
            const entry = directory.find(e => e.subject === subject);
            const updates = {
                title, author, notes, subject,
                floor: entry ? entry.floor : '',
                aisle: entry ? entry.aisle : '',
                room:  entry ? entry.room  : '',
            };
            try {
                await updateSavedBook(id, updates);
                loadSavedBooks();
            } catch (err) {
                alert('Update failed: ' + err.message);
            }
        }

        async function updateSavedBook(id, fields) {
            await db.collection('savedBooks').doc(id).update({
                ...fields,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
            });
        }

        async function deleteSavedBook(id) {
            if (!confirm('Delete this book from the library?')) return;
            try {
                await db.collection('savedBooks').doc(id).delete();
                loadSavedBooks();
            } catch (err) {
                alert('Delete failed: ' + err.message);
            }
        }

        // ===================================
        // AI Classification
        // ===================================
        async function classifyBookWithAI(title, description) {
            const subjects = directory.map(entry => entry.subject);
            const idToken = await currentUser.getIdToken();
            const response = await fetchWithTimeout(CLOUD_FUNCTION_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${idToken}`
                },
                body: JSON.stringify({title, description, subjects})
            }, 30000);
            if (!response.ok) {
                const errorData = await response.json();
                if (response.status === 429) {
                    const err = new Error(errorData.error || 'Guest scan limit reached. Sign in with Google for unlimited access.');
                    err.isGuestLimit = true;
                    throw err;
                }
                if (errorData.useFallback) return null;
                throw new Error(`Cloud Function error: ${errorData.message || response.statusText}`);
            }
            const data  = await response.json();
            const match = directory.find(entry => entry.subject === data.subject);
            if (match) {
                console.log(`✅ AI classified book as: "${data.subject}"`);
                return { ...match, reasoning: data.reasoning || '' };
            }
            return null;
        }

        // ===================================
        // UI Helpers
        // ===================================
        async function flagResult() {
            if (!currentUser || !pendingSave || !pendingSave.aiSubject) return;
            const btn = document.querySelector('#result-flag-area button');
            if (btn) { btn.disabled = true; btn.textContent = 'Submitting…'; }
            try {
                await db.collection('flaggedScans').add({
                    title:       pendingSave.title || '',
                    author:      pendingSave.author || '',
                    isbn:        pendingSave.isbn || '',
                    description: pendingSave.description || '',
                    aiSubject:   pendingSave.aiSubject || '',
                    aiReasoning: pendingSave.aiReasoning || '',
                    source:      pendingSave.source || '',
                    userType:    isGuest ? 'guest' : 'named',
                    flaggedBy:   isGuest ? currentUser.uid : (currentUser.email || currentUser.uid),
                    flaggedAt:   firebase.firestore.FieldValue.serverTimestamp(),
                });
                if (btn) btn.textContent = '✓ Flagged — thanks!';
            } catch (err) {
                console.error('Flag error:', err);
                if (btn) { btn.disabled = false; btn.textContent = '🚩 Flag AI result'; }
                showStatus('Could not submit flag. Please try again.');
                setTimeout(hideStatus, 2000);
            }
        }

        function showGuestLimitInResults(message) {
            hideStatus();
            document.getElementById('results').innerHTML = `
                <div class="guest-limit-card">
                    <div class="guest-limit-title">Daily scan limit reached</div>
                    <div class="guest-limit-body">${escapeHtml(message)}</div>
                    <button class="btn-google" onclick="signInWithGoogle()">
                        <svg width="17" height="17" viewBox="0 0 18 18">
                            <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
                            <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
                            <path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/>
                            <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 6.294C4.672 4.169 6.656 3.58 9 3.58z"/>
                        </svg>
                        Sign in with Google
                    </button>
                </div>
            `;
        }

        function toggleDescription() {
            const desc = document.getElementById('description');
            const btn  = event.target;
            if (desc.classList.contains('expanded')) {
                desc.classList.remove('expanded'); btn.textContent = 'Show more ▼';
            } else {
                desc.classList.add('expanded'); btn.textContent = 'Show less ▲';
            }
        }

        function showStatus(message) {
            const el = document.getElementById('status');
            el.textContent  = message;
            el.style.display = 'block';
        }

        function hideStatus() {
            document.getElementById('status').style.display = 'none';
        }

        function showError(message) {
            document.getElementById('results').innerHTML = `<div class="error-card">${escapeHtml(message)}</div>`;
        }

        function escapeHtml(str) {
            return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // ===================================
        // Init
        // ===================================
        document.addEventListener('DOMContentLoaded', () => {
            loadDirectory();
            document.getElementById('search-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') performSearch();
            });
        });
    </script>
